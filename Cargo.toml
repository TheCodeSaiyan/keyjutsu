[workspace]
resolver = "3"
members = [
    "crates/keyjutsu-terminal",
    "crates/keyjutsu-execution",
    "crates/keyjutsu-core",
    "cli/keyjutsu",
    "apps/desktop/src-tauri",
]
# The desktop crate embeds the built frontend at compile time, so a plain
# `cargo test` would fail before `pnpm build` has run. It is built through
# `pnpm tauri build` or explicitly with `-p keyjutsu-desktop`.
default-members = [
    "crates/keyjutsu-terminal",
    "crates/keyjutsu-execution",
    "crates/keyjutsu-core",
    "cli/keyjutsu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
keyjutsu-terminal = { path = "crates/keyjutsu-terminal" }
keyjutsu-execution = { path = "crates/keyjutsu-execution" }
keyjutsu-core = { path = "crates/keyjutsu-core" }

clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
getrandom = "0.4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
thiserror = "2"
ts-rs = "12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
