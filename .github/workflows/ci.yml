name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust, including the real-shell tests: PowerShell 7, Windows PowerShell 5.1
  # and cmd.exe through ConPTY, which is why this runs on Windows.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # §57: a release does not ship unless every gate's named tests pass.
      # A renamed or deleted test fails its gate rather than dropping out.
      - run: node scripts/release-gates.mjs
      # ts-rs rewrites the TypeScript bindings during `cargo test`. A diff here
      # means a Rust IPC type changed without its TypeScript counterpart.
      - name: Generated TypeScript is current
        shell: bash
        run: |
          git add -N packages/types/src/generated
          git diff --exit-code -- packages/types/src/generated

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm schemas:check
      - run: pnpm tokens:check
      - run: pnpm --filter @keyjutsu/desktop build

  # The desktop app, bundled into the NSIS installer with the CLI and the
  # elevation broker beside it (Milestone 16). Signed only when the signing
  # certificate is configured as secrets; an unsigned installer is still built
  # and kept, so a pull request from a fork produces something to try.
  desktop:
    runs-on: windows-latest
    # Only whether signing is configured; the secrets themselves reach the
    # signing step alone, not the build steps and their install scripts.
    env:
      CAN_SIGN: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keyjutsu/desktop build
      - run: cargo clippy -p keyjutsu-desktop --all-targets -- -D warnings
      - run: pnpm --filter @keyjutsu/desktop tauri build
      - name: Sign the installer
        if: env.CAN_SIGN == 'true'
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:SIGNING_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          }
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: keyjutsu-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod
