name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust, including the real-shell tests: PowerShell 7, Windows PowerShell 5.1
  # and cmd.exe through ConPTY, which is why this runs on Windows.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # A release does not ship unless every gate's named tests pass.
      # A renamed or deleted test fails its gate rather than dropping out.
      - run: node scripts/release-gates.mjs
      # The docs against the CLI just built: commands, options, links,
      # headings, pages nothing links to, and the house style.
      - run: node scripts/docs-check.mjs
      # ts-rs rewrites the TypeScript bindings during `cargo test`. A diff here
      # means a Rust IPC type changed without its TypeScript counterpart.
      - name: Generated TypeScript is current
        shell: bash
        run: |
          git add -N packages/types/src/generated
          git diff --exit-code -- packages/types/src/generated

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm schemas:check
      # Every place the version is written says the same thing.
      - run: node scripts/version.mjs
      - run: pnpm tokens:check
      - run: pnpm --filter @keyjutsu/desktop build

  # The desktop app, bundled into the NSIS installer with the CLI and the
  # elevation broker beside it. Unsigned here and kept, so every change,
  # including a pull request from a fork, produces something to try; signing
  # belongs to release.yml, which is the only place a signing identity is used.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keyjutsu/desktop build
      # The desktop crate's build script needs the CLI and broker beside it
      # (bundle.externalBin), even for clippy; tauri build stages them itself.
      - run: node scripts/stage-sidecars.mjs
      - run: cargo clippy --locked -p keyjutsu-desktop --all-targets -- -D warnings
      # Not a default workspace member, so the rust job doesn't test it.
      - run: cargo test --locked -p keyjutsu-desktop
      - run: pnpm --filter @keyjutsu/desktop tauri build
      # The release publishes one; it is made here too, so a change that
      # breaks it is found on the pull request, not on the tag.
      - run: node scripts/sbom.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: keyjutsu-installer-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod
