name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust, including the real-shell tests: PowerShell 7, Windows PowerShell 5.1
  # and cmd.exe through ConPTY, which is why this runs on Windows.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # ts-rs rewrites the TypeScript bindings during `cargo test`. A diff here
      # means a Rust IPC type changed without its TypeScript counterpart.
      - name: Generated TypeScript is current
        shell: bash
        run: |
          git add -N packages/types/src/generated
          git diff --exit-code -- packages/types/src/generated

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm schemas:check
      - run: pnpm --filter @keyjutsu/desktop build

  # The desktop binary, built against the frontend. Unbundled: installers and
  # signing belong to the release pipeline (Milestone 16).
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keyjutsu/desktop build
      - run: cargo clippy -p keyjutsu-desktop --all-targets -- -D warnings
      - run: pnpm --filter @keyjutsu/desktop tauri build --no-bundle

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod
